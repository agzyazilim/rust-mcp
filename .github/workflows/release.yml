name: Release

on:
  # Pushing release/<Cargo version> is an explicit publication request.
  push:
    branches:
      - "release/*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Exact tag to create, for example agz-rust-mcp-v0.5.0"
        required: true
        type: string
      publish:
        description: "Publish the verified crate, MCP metadata, and GitHub release after approval"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  regression:
    name: Release regression gate
    uses: ./.github/workflows/ci.yml

  verify:
    name: Verify release artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_INCREMENTAL: 0
    permissions:
      contents: read
    steps:
      - name: Check out the dispatched commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.88.0 --profile minimal \
            --component rustfmt \
            --component clippy \
            --component rust-analyzer

      - name: Validate requested release identity
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          VERSION="$(cargo +1.88.0 metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "agz-rust-mcp") | .version')"
          EXPECTED_TAG="agz-rust-mcp-v${VERSION}"
          if [[ "$GITHUB_EVENT_NAME" = "push" ]]; then
            test "$GITHUB_REF" = "refs/heads/release/${VERSION}"
          else
            test "$REQUESTED_TAG" = "$EXPECTED_TAG"
          fi

      - name: Verify clean source and full gate
        shell: bash
        run: |
          test -z "$(git status --porcelain)"
          cargo +1.88.0 fmt --all --check
          cargo +1.88.0 clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo +1.88.0 test --workspace --all-targets --all-features --locked --no-fail-fast
          cargo +1.88.0 check --workspace --all-targets --all-features --locked
          cargo +1.88.0 build --release --locked

      - name: Verify protocol and benchmark smoke
        shell: bash
        run: |
          MCP_BIN_DIR="$(mktemp -d)"
          install -m 0755 target/release/agz-rust-mcp "$MCP_BIN_DIR/agz-rust-mcp"
          AGZ_RUST_MCP_BIN="$MCP_BIN_DIR/agz-rust-mcp" \
            cargo +1.88.0 run --locked -p xtask -- protocol-smoke
          AGZ_RUST_MCP_BIN="$MCP_BIN_DIR/agz-rust-mcp" \
            cargo +1.88.0 run --locked -p xtask -- benchmark-smoke
          AGZ_RUST_MCP_BIN="$MCP_BIN_DIR/agz-rust-mcp" \
            cargo +1.88.0 run --locked -p xtask -- task-benchmark-smoke

      - name: Validate MCP Registry metadata
        shell: bash
        run: |
          test "$(wc -c < server.json)" -le 4096
          STATUS="$(curl --silent --show-error \
            --header 'Content-Type: application/json' \
            --data-binary @server.json \
            --output registry-validation.json \
            --write-out '%{http_code}' \
            https://registry.modelcontextprotocol.io/v0.1/validate)"
          test "$STATUS" = "200"
          jq -e '.valid == true and (.issues | length == 0)' \
            registry-validation.json >/dev/null

      - name: Verify pinned real Rust Analyzer
        shell: bash
        run: |
          RA_BIN="$(rustup which --toolchain 1.88.0 rust-analyzer)"
          test -x "$RA_BIN"
          "$RA_BIN" --version
          AGZ_RUST_MCP_RUST_ANALYZER__PATH="$RA_BIN" \
            cargo +1.88.0 test -p agz-rust-mcp --test lsp_real --locked -- --ignored

      - name: Package, fresh-install, and dry-run publish
        shell: bash
        env:
          CARGO_BUILD_JOBS: 1
          CARGO_INCREMENTAL: 0
        run: |
          cargo +1.88.0 package -p agz-rust-mcp --locked
          cargo +1.88.0 publish -p agz-rust-mcp --dry-run --locked
          VERSION="$(cargo +1.88.0 metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "agz-rust-mcp") | .version')"
          PACKAGE_DIR="$(mktemp -d)"
          INSTALL_ROOT="$(mktemp -d)"
          tar -xzf "target/package/agz-rust-mcp-${VERSION}.crate" -C "$PACKAGE_DIR"
          cargo +1.88.0 install \
            --path "$PACKAGE_DIR/agz-rust-mcp-${VERSION}" \
            --root "$INSTALL_ROOT" \
            --locked \
            --offline
          "$INSTALL_ROOT/bin/agz-rust-mcp" --version
          AGZ_RUST_MCP_BIN="$INSTALL_ROOT/bin/agz-rust-mcp" \
            cargo +1.88.0 run --locked -p xtask -- protocol-smoke
          AGZ_RUST_MCP_BIN="$INSTALL_ROOT/bin/agz-rust-mcp" \
            cargo +1.88.0 run --locked -p xtask -- benchmark-smoke
          AGZ_RUST_MCP_BIN="$INSTALL_ROOT/bin/agz-rust-mcp" \
            cargo +1.88.0 run --locked -p xtask -- task-benchmark-smoke
          git bundle create target/package/agz-rust-mcp-source.bundle HEAD
          printf '%s\n' "$GITHUB_SHA" > target/package/SOURCE_SHA
          cp install.sh target/package/install.sh
          (cd target/package && sha256sum agz-rust-mcp-*.crate agz-rust-mcp-source.bundle install.sh > SHA256SUMS)

      - name: Upload verified package artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifact-package-${{ github.sha }}
          path: |
            target/package/agz-rust-mcp-*.crate
            target/package/agz-rust-mcp-source.bundle
            target/package/SHA256SUMS
            target/package/SOURCE_SHA
            target/package/install.sh
          if-no-files-found: error
          retention-days: 7
          overwrite: false

      - name: Run dependency policy
        shell: bash
        run: |
          cargo +1.88.0 install cargo-deny --version 0.20.2 --locked
          cargo +1.88.0 deny check

  release-binaries:
    name: Build release binary (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
            binary: agz-rust-mcp
          - os: macos-15
            platform: macos-arm64
            binary: agz-rust-mcp
          - os: windows-2025
            platform: windows-x86_64
            binary: agz-rust-mcp.exe
    steps:
      - name: Check out the dispatched commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.88.0 --profile minimal

      - name: Build release binary
        shell: bash
        run: cargo +1.88.0 build --release -p agz-rust-mcp --locked

      - name: Package binary and checksum
        shell: bash
        env:
          BINARY: ${{ matrix.binary }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          test -f "target/release/$BINARY"
          cd target/release
          ARCHIVE="agz-rust-mcp-${PLATFORM}.tar.gz"
          tar -czf "$ARCHIVE" "$BINARY"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          else
            shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
          fi

      - name: Upload binary artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifact-binary-${{ matrix.platform }}-${{ github.sha }}
          path: |
            target/release/agz-rust-mcp-${{ matrix.platform }}.tar.gz
            target/release/agz-rust-mcp-${{ matrix.platform }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
          overwrite: false

  publish:
    name: Publish approved release
    if: >-
      inputs.publish == true ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/'))
    needs:
      - regression
      - verify
      - release-binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: release
      url: https://github.com/agzyazilim/rust-mcp/releases
    permissions:
      contents: write
      actions: read
      id-token: write
    steps:
      - name: Download verified package artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifact-*-${{ github.sha }}
          path: release-artifact
          merge-multiple: true

      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.88.0 --profile minimal

      - name: Verify artifact checksum and release tag
        id: metadata
        shell: bash
        env:
          CARGO_BUILD_JOBS: 1
          CARGO_INCREMENTAL: 0
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          (cd release-artifact && sha256sum --check SHA256SUMS)
          mapfile -t BINARY_CHECKSUMS < <(find release-artifact -maxdepth 1 -name '*.tar.gz.sha256' -print)
          test "${#BINARY_CHECKSUMS[@]}" -eq 3
          for checksum in "${BINARY_CHECKSUMS[@]}"; do
            (cd "$(dirname "$checksum")" && sha256sum --check "$(basename "$checksum")")
          done
          test "$(cat release-artifact/SOURCE_SHA)" = "$GITHUB_SHA"
          git clone release-artifact/agz-rust-mcp-source.bundle release-source
          test "$(git -C release-source rev-parse HEAD)" = "$GITHUB_SHA"
          cargo +1.88.0 package --manifest-path release-source/Cargo.toml -p agz-rust-mcp --locked
          ARTIFACT_SHA="$(awk 'NR == 1 {print $1}' release-artifact/SHA256SUMS)"
          BUILT_SHA="$(sha256sum release-source/target/package/agz-rust-mcp-*.crate | awk 'NR == 1 {print $1}')"
          test "$ARTIFACT_SHA" = "$BUILT_SHA"
          VERSION="$(cargo +1.88.0 metadata --manifest-path release-source/Cargo.toml --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "agz-rust-mcp") | .version')"
          EXPECTED_TAG="agz-rust-mcp-v${VERSION}"
          if [[ "$GITHUB_EVENT_NAME" = "push" ]]; then
            test "$GITHUB_REF" = "refs/heads/release/${VERSION}"
            REQUESTED_TAG="$EXPECTED_TAG"
          fi
          test "$REQUESTED_TAG" = "$EXPECTED_TAG"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$EXPECTED_TAG" >> "$GITHUB_OUTPUT"

      - name: Verify release tag is unused
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          TAG_ERROR="$(mktemp)"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>"$TAG_ERROR"; then
            echo "Refusing to reuse or move existing tag ${RELEASE_TAG}." >&2
            exit 1
          elif ! grep --fixed-strings --quiet '(HTTP 404)' "$TAG_ERROR"; then
            echo 'Could not verify release tag availability; refusing publication.' >&2
            exit 1
          fi

      - name: Install pinned MCP Registry publisher
        shell: bash
        run: |
          ARCHIVE="mcp-publisher_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/${ARCHIVE}" \
            --output "$ARCHIVE"
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  ${ARCHIVE}" \
            | sha256sum --check
          tar -xzf "$ARCHIVE" mcp-publisher
          test "$(./mcp-publisher --version 2>&1 | sed -n 's/.*mcp-publisher \([^ ]*\).*/\1/p')" = "1.8.1"

      - name: Check publication identity and credentials
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          EXPECTED_NAME="io.github.${GITHUB_REPOSITORY}"
          jq --exit-status --arg name "$EXPECTED_NAME" --arg version "$VERSION" \
            --arg repository "https://github.com/${GITHUB_REPOSITORY}" \
            '.name == $name and .version == $version and
             .repository.url == $repository and
             (.packages | length == 1) and
             .packages[0].registryType == "cargo" and
             .packages[0].identifier == "agz-rust-mcp" and
             .packages[0].version == $version' \
            release-source/server.json >/dev/null
          grep --fixed-strings --quiet "mcp-name: ${EXPECTED_NAME}" \
            release-source/crates/agz-rust-mcp/README.md
          RESPONSE="$(mktemp)"
          STATUS="$(curl --silent --show-error --location --max-time 60 \
            --output "$RESPONSE" --write-out '%{http_code}' \
            --user-agent "agz-rust-mcp-release/${VERSION}" \
            "https://crates.io/api/v1/crates/agz-rust-mcp/${VERSION}")"
          case "$STATUS" in
            200)
              EXPECTED_SHA="$(awk 'NR == 1 {print $1}' release-artifact/SHA256SUMS)"
              test "$(jq -er '.version.checksum' "$RESPONSE")" = "$EXPECTED_SHA"
              ;;
            404)
              if [[ -z "${CARGO_REGISTRY_TOKEN:-}" ]]; then
                echo 'The release environment must configure CRATES_IO_TOKEN before publication.' >&2
                exit 1
              fi
              ;;
            *)
              echo "crates.io preflight failed with HTTP ${STATUS}." >&2
              exit 1
              ;;
          esac
          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]]; then
            echo 'GitHub OIDC is unavailable; the publish job requires id-token: write.' >&2
            exit 1
          fi
          SERVER_NAME="$(jq --raw-output '.name | @uri' release-source/server.json)"
          ENDPOINT="https://registry.modelcontextprotocol.io/v0.1/servers/${SERVER_NAME}/versions/${VERSION}"
          STATUS="$(curl --silent --show-error --max-time 60 \
            --output registry-preflight.json --write-out '%{http_code}' "$ENDPOINT")"
          case "$STATUS" in
            200)
              jq --sort-keys . release-source/server.json > expected-server.json
              jq --sort-keys .server registry-preflight.json > published-server.json
              cmp --silent expected-server.json published-server.json
              ;;
            404) ;;
            *)
              echo "MCP Registry preflight failed with HTTP ${STATUS}." >&2
              exit 1
              ;;
          esac

      - name: Authenticate MCP Registry before package publication
        shell: bash
        run: ./mcp-publisher login github-oidc

      - name: Publish the verified package
        shell: bash
        env:
          CARGO_BUILD_JOBS: 1
          CARGO_INCREMENTAL: 0
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          RESPONSE="$(mktemp)"
          STATUS="$(curl --silent --show-error --location \
            --output "$RESPONSE" \
            --write-out '%{http_code}' \
            --user-agent "agz-rust-mcp-release/${VERSION}" \
            "https://crates.io/api/v1/crates/agz-rust-mcp/${VERSION}")"
          case "$STATUS" in
            200)
              EXPECTED_SHA="$(awk 'NR == 1 {print $1}' release-artifact/SHA256SUMS)"
              PUBLISHED_SHA="$(jq -er '.version.checksum' "$RESPONSE")"
              test "$PUBLISHED_SHA" = "$EXPECTED_SHA"
              echo "agz-rust-mcp ${VERSION} is already published with the verified checksum."
              ;;
            404)
              cargo +1.88.0 publish \
                --manifest-path release-source/Cargo.toml \
                -p agz-rust-mcp \
                --locked
              ;;
            *)
              echo "crates.io version lookup failed with HTTP ${STATUS}." >&2
              exit 1
              ;;
          esac

      - name: Publish MCP Registry metadata
        shell: bash
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          SERVER_NAME="io.github.agzyazilim%2Frust-mcp"
          ENDPOINT="https://registry.modelcontextprotocol.io/v0.1/servers/${SERVER_NAME}/versions/${VERSION}"
          STATUS="$(curl --silent --show-error --output registry-response.json --write-out '%{http_code}' "$ENDPOINT")"
          case "$STATUS" in
            200)
              jq --sort-keys . release-source/server.json > expected-server.json
              jq --sort-keys .server registry-response.json > published-server.json
              cmp --silent expected-server.json published-server.json
              ;;
            404)
              for attempt in 1 2 3 4 5 6; do
                if ./mcp-publisher publish release-source/server.json; then
                  break
                fi
                test "$attempt" -lt 6
                sleep $((attempt * 10))
              done
              ;;
            *)
              echo "MCP Registry lookup failed with HTTP ${STATUS}." >&2
              exit 1
              ;;
          esac

      - name: Create immutable GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            release-artifact/*.crate \
            release-artifact/agz-rust-mcp-source.bundle \
            release-artifact/*.tar.gz \
            release-artifact/*.tar.gz.sha256 \
            release-artifact/SHA256SUMS \
            release-artifact/install.sh \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --generate-notes
